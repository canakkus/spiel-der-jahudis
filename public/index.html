<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spiel der Jahudis - Controller</title>
  <link rel="stylesheet" href="/css/controller.css">
</head>
<body>

  <!-- SCREEN 1: JOIN & CHARACTER SELECTION -->
  <div id="join-screen" class="screen active">
    <div class="join-container">
      <div class="app-title">🎲 SPIEL DER JAHUDIS</div>

      <!-- QR Code Detected Badge -->
      <div id="qr-connected-badge" class="qr-connected-badge" style="display: none;">
        <span>✅</span>
        <span>Mit Raum <strong id="qr-room-name">----</strong> verbunden</span>
      </div>

      <div class="input-group" id="group-room-code">
        <label>4-Stelliger Raum-Code</label>
        <input type="text" id="input-room-code" class="input-field room-code" maxlength="4" placeholder="ABCD" autocomplete="off" autocorrect="off" autocapitalize="characters">
      </div>

      <div class="input-group">
        <label>Dein Spielername</label>
        <input type="text" id="input-player-name" class="input-field" placeholder="z. B. Can, Alex, Boss..." maxlength="14" autofocus>
      </div>

      <div class="input-group">
        <label>Wähle deinen Jahudi-Charakter</label>
        <div class="character-list" id="character-list">
          <!-- Dynamic Character Cards -->
        </div>
      </div>

      <button id="btn-join-game" class="btn-join">BEITRETEN 🚀</button>
    </div>
  </div>

  <!-- SCREEN 2: IN-GAME CONTROLLER -->
  <div id="game-screen" class="screen">
    <!-- Player Stats Bar -->
    <div class="player-bar">
      <div class="player-info-mini">
        <span id="player-avatar-mini" style="font-size: 28px;">💼</span>
        <div>
          <div id="player-name-display" style="font-weight: 800; font-size: 16px;">Spieler</div>
          <div id="player-character-display" style="font-size: 11px; color: var(--accent-gold);">Business Jahudi</div>
        </div>
      </div>
      <div class="player-stats-mini">
        <span id="player-money-display" style="color: #22c55e;">50k €</span>
        <span id="player-happiness-display" style="color: #ec4899;">20 ❤️</span>
      </div>
    </div>

    <!-- Active Action Zone -->
    <div class="turn-action-container">
      <!-- State A: It is YOUR turn -->
      <div id="my-turn-box" style="display: none;">
        <button id="btn-spin" class="btn-spin-wheel">
          <span style="font-size: 40px;">🎲</span>
          <span>RAD DREHEN!</span>
        </button>
        <p style="margin-top: 16px; font-weight: 700; color: var(--accent-gold);">Tippe auf das Rad, um zu ziehen!</p>
      </div>

      <!-- State B: Waiting for other player -->
      <div id="waiting-turn-box" class="waiting-box">
        <div class="waiting-spinner">⏳</div>
        <div id="waiting-status-text" style="font-size: 20px; font-weight: 800;">Warte auf Spielstart...</div>
        <p style="font-size: 14px; text-align: center; max-width: 280px;">Benutze das Soundboard unten, um das Spiel auf dem TV zu kommentieren!</p>
      </div>
    </div>

    <!-- STICKY BOTTOM SOUNDBOARD -->
    <div class="soundboard-bar">
      <div class="soundboard-title">🔊 Live Soundboard (TV Reaktionen)</div>
      <div class="sound-buttons">
        <button class="btn-sound" data-sound="honk">
          <span class="btn-sound-icon">🚗</span>
          <span class="btn-sound-label">Hupe</span>
        </button>
        <button class="btn-sound" data-sound="kaching">
          <span class="btn-sound-icon">💸</span>
          <span class="btn-sound-label">Kasse</span>
        </button>
        <button class="btn-sound" data-sound="laugh">
          <span class="btn-sound-icon">😂</span>
          <span class="btn-sound-label">Lachen</span>
        </button>
        <button class="btn-sound" data-sound="cheer">
          <span class="btn-sound-icon">👏</span>
          <span class="btn-sound-label">Jubel</span>
        </button>
        <button class="btn-sound" data-sound="fail">
          <span class="btn-sound-icon">🎺</span>
          <span class="btn-sound-label">Fail</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/controller.js"></script>
</body>
</html>
